# Hecho con asistencia de IA (Claude) — Seal Hackathon Team, NASA Space Apps Sucre 2026
# Lugares de la Tierra a evaluar (docs/SITIOS_CANDIDATOS.md). Coordenadas y referencias buscadas y comprobadas con
# WebSearch/WebFetch el 2026-11-14 (Claude Fable 5.2). Ver docs/VALORES_A_VERIFICAR.md.
# - Los 11 sitios del juego conservan sus coordenadas tal como están en referencias/juego/sites/.
# - coord.status: literature (paper/sitio oficial) · estimated (Wikipedia/GeoNames/OSM) · pending (no se procesa).
# - role: candidate · control_pos (necesita una ref que lo llame análogo) · control_neg.
# - Borde de mosaico: algunos puntos quedan a < 0,05° de un grado entero (Etna, Valles Secos, Askja, Valle de las
#   Ánimas, Palca, Bromo). fetch/dem.py une los mosaicos vecinos cuando la ventana cruza el borde.
# - Reserva Eduardo Avaroa = REGIÓN (region: reserva_eduardo_avaroa), no un sitio.
