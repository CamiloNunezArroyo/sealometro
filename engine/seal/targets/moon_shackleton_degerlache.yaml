note: "Williams et al. 2019 (JGR Planets, doi:10.1029/2019JE006028, sec. 4.2, leído por el equipo): en la cresta 'Connecting Ridge C2' (Gläser et al. 2018) la temperatura de SUPERFICIE es ~200 K en verano, con sombras breves (~20–22 h) y alternancia de luz y sombra en invierno. No se usa como t_mean (es superficie y solo verano; la Tierra se compara con aire). Candidata clásica a base permanente por su iluminación CASI continua: Bussey et al. 2010, Icarus, doi:10.1016/j.icarus.2010.03.028; Mazarico et al. 2011, Icarus, doi:10.1016/j.icarus.2010.10.030 (un punto cerca del borde de Shackleton recibe sol continuo ~240 días al año; mayor oscuridad total ~1,5 días)."
