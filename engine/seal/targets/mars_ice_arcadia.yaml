note: "Hielo en exceso de decenas de metros (Bramson et al. 2015, GRL, doi:10.1002/2015GL064844); SWIM: Arcadia y Deuteronilus Mensae son las mejores zonas (Morgan et al. 2021, Nat. Astron., doi:10.1038/s41550-020-01290-z). Ninguna da valores para nuestras dimensiones T1: la dimensión clave (ice_presence) es T2. Cobertura baja a propósito."
